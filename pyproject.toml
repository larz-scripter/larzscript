[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "larzscript"
version = "1.2.0"
description = "A money-native programming language - payments, wallets and metering as language keywords, zero dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "larz-scripter" }]
keywords = ["programming-language", "interpreter", "money-native", "payments", "compiler", "education", "learn-to-code", "dsl", "gas-metering", "zero-dependency", "pure-python"]
classifiers = ["Development Status :: 4 - Beta","Intended Audience :: Developers","License :: OSI Approved :: MIT License","Programming Language :: Python :: 3","Programming Language :: Python :: 3.8","Programming Language :: Python :: 3.9","Programming Language :: Python :: 3.10","Programming Language :: Python :: 3.11","Programming Language :: Python :: 3.12","Programming Language :: Python :: 3.13","Topic :: Software Development :: Libraries :: Python Modules"]
dependencies = []
[project.urls]
Homepage = "https://github.com/larz-scripter/larzscript"
Repository = "https://github.com/larz-scripter/larzscript"
Issues = "https://github.com/larz-scripter/larzscript/issues"
[project.scripts]
larzscript = "larzscript.cli:main"
[tool.setuptools]
packages = ["larzscript", "larzscript.adapters"]
