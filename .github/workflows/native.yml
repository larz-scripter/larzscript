                if d == "" { break }
                ssh_channel_write(channel, d)
              }
            }
            socket_close(local_fd)
            ssh_channel_free(channel)
          }
          LZEOF
          /tmp/_larzscript_test /tmp/verify_forward.lz &
          FWD_PID=$!
          sleep 2
          python3 -c "
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.connect(('127.0.0.1', 19900))
          s.settimeout(20)
          banner = s.recv(200)
          print('banner:', banner)
