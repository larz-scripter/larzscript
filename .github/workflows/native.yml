          "
          kill $FWD_PID 2>/dev/null || true
      - name: Build release binary
        run: |
          LIBSSH_PREFIX="$(brew --prefix libssh)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          if [ -f "$LIBSSH_PREFIX/lib/libssh.a" ]; then
            cc -O2 -std=c11 -Wall -DLARZ_HAVE_LIBSSH -I"$LIBSSH_PREFIX/include" -I"$OPENSSL_PREFIX/include" \
              -o larzscript-macos-arm64 native/larzscript.c native/gssapi_stub.c \
              "$LIBSSH_PREFIX/lib/libssh.a" -L"$OPENSSL_PREFIX/lib" -lssl -lcrypto -lz
          else
            cc -O2 -std=c11 -Wall -DLARZ_HAVE_LIBSSH -I"$LIBSSH_PREFIX/include" -I"$OPENSSL_PREFIX/include" \
              -o larzscript-macos-arm64 native/larzscript.c native/gssapi_stub.c \
