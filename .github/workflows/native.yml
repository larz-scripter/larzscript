name: Native

# Builds, tests, and releases the native C implementation (native/larzscript.c)
# for every shipped platform (Linux x86_64/aarch64, macOS x86_64/arm64,
# Windows x86_64, web/wasm), entirely on GitHub-hosted runners - no
# dependency on any private server. This is separate from ci.yml/publish.yml,
# which cover only the frozen legacy Python reference implementation.
#
# No `paths:` filter on the triggers below: path filters are evaluated
# per-ref, and a tag push whose commit doesn't itself touch native/** can
# silently fail to trigger the workflow at all - exactly the failure mode a
# release pipeline can't afford. The build+test jobs are cheap, so running
# them on every push/PR is a fine tradeoff for that guarantee.

on:
  push:
    branches: [main]
    tags: ["native-v*"]
  pull_request:
    branches: [main]

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phase 1 of real SSH interop (see larzscript's own plan/issue for
      # the full multi-platform rollout). Built from source as static
      # libraries here, not `apt-get install libssh-dev` - Ubuntu's
      # package only ships a shared library, and linking that would mean
      # the ENTIRE larzscript binary (not just ssh_* calls) fails to even
      # launch on a machine without libssh.so installed - a real
      # regression for every existing user of this binary, caught before
      # ever tagging a release with it. mbedTLS (Apache 2.0, permissive)
      # is libssh's crypto backend here, not OpenSSL/gcrypt, to avoid
      # stacking a second copyleft dependency on top of libssh's own LGPL
      # (see native/THIRD_PARTY_LICENSES.md).
      #
      # Not yet on macOS/Windows/linux-aarch64/wasm - ssh_* builtins throw
      # a clear SshError there until each platform gets its own libssh
      # wiring, same convention sockets already use for wasm.
      #
      # Ubuntu's libssh-dev ships BOTH libssh.so and a real static
      # libssh.a (confirmed via `dpkg -L libssh-dev`) - no from-scratch
      # source build needed, an earlier version of this job built libssh +
      # mbedTLS from source assuming otherwise, wasted effort once this
      # was checked directly. libssl-dev is libssh's crypto backend here
      # (Ubuntu noble's OpenSSL 3.x, Apache 2.0 - see
      # THIRD_PARTY_LICENSES.md), also has a static .a.
      - name: Install libssh (static archive included)
        run: sudo apt-get update && sudo apt-get install -y libssh-dev libssl-dev
      - name: Build test binary (fully static, including libssh)
        run: cc -O2 -std=c11 -Wall -DLARZ_HAVE_LIBSSH -static -o /tmp/_larzscript_test native/larzscript.c -lssh -lssl -lcrypto
      - name: Test
        run: cd native && BINARY=/tmp/_larzscript_test ./run_tests.sh
      - name: Confirm no dynamic dependency on libssh
        run: |
          if ldd /tmp/_larzscript_test 2>&1 | grep -qi "not a dynamic executable"; then
            echo "confirmed fully static"
          else
            echo "FAIL: binary is not fully static"; ldd /tmp/_larzscript_test; exit 1
          fi
      # Real end-to-end proof, not just "it links": this sandbox this was
      # developed in has no general internet access (apt/libssh unreachable
      # there), so this CI job is the only environment that actually has
      # both libssh AND the internet access to install a real sshd to test
      # against - this step is the verification, not an afterthought.
      - name: Verify ssh.run() against a real local sshd
        run: |
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          ssh-keygen -t ed25519 -f /tmp/verify_key -N ""
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat /tmp/verify_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo /usr/sbin/sshd -p 2222
          cat > /tmp/verify_ssh.lz << 'LZEOF'
          # Calls the raw builtins directly - the "ssh" package (thin
          # sugar over these) lives in the separate larzscript-packages
          # repo, not checked out in this job; this is what's actually
          # being verified here anyway.
          let session = ssh_open("127.0.0.1", 2222)
          ssh_auth_key(session, env("USER", "runner"), "/tmp/verify_key")
          let result = ssh_run(session, "echo hello-from-real-sshd && whoami")
          print("stdout: " + result["stdout"])
          print("exit_status: " + str(result["exit_status"]))
          if not result["stdout"].contains("hello-from-real-sshd") { print("FAIL: unexpected output"); exit(1) }
          if result["exit_status"] != 0 { print("FAIL: nonzero exit status"); exit(1) }
          ssh_close(session)
          print("PASS")
          LZEOF
          /tmp/_larzscript_test /tmp/verify_ssh.lz
      - name: Build release binary (static, including libssh)
        run: |
          cc -O2 -std=c11 -Wall -DLARZ_HAVE_LIBSSH -static -o larzscript-linux-x86_64 native/larzscript.c -lssh -lssl -lcrypto
          strip larzscript-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: larzscript-linux-x86_64
          path: larzscript-linux-x86_64

  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + qemu
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
      - name: Build (static)
        run: |
          aarch64-linux-gnu-gcc -O2 -std=c11 -Wall -static -o larzscript-linux-aarch64 native/larzscript.c
      - name: Test under qemu-user
        run: |
          cd native
          BINARY=../larzscript-linux-aarch64 RUN_PREFIX=qemu-aarch64-static ./run_tests.sh
      - name: Strip
        run: aarch64-linux-gnu-strip larzscript-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: larzscript-linux-aarch64
          path: larzscript-linux-aarch64

  macos-x86_64:
    runs-on: macos-15-intel   # last Intel-based GitHub-hosted macOS runner (macos-13 was fully deprecated Dec 2025)
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cd native && ./run_tests.sh
      - name: Build release binary
        # No -static here: unlike Linux, macOS binaries are not meant to
        # statically link against libSystem (Apple doesn't support it) -
        # a normal dynamic build against the system libc is the correct,
        # portable form, and every Mac already has libSystem present.
        run: cc -O2 -std=c11 -Wall -o larzscript-macos-x86_64 native/larzscript.c
      - uses: actions/upload-artifact@v4
        with:
          name: larzscript-macos-x86_64
          path: larzscript-macos-x86_64

  macos-arm64:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cd native && ./run_tests.sh
      - name: Build release binary
        run: cc -O2 -std=c11 -Wall -o larzscript-macos-arm64 native/larzscript.c
      - uses: actions/upload-artifact@v4
        with:
          name: larzscript-macos-arm64
          path: larzscript-macos-arm64

  windows-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64 + wine
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 wine
      - name: Build (static)
        run: |
          x86_64-w64-mingw32-gcc -O2 -std=c11 -Wall -static -o larzscript-windows-x86_64.exe native/larzscript.c -lwinpthread -lws2_32
      - name: Wine warm-up (creates the wine prefix + first-run noise once, outside the test loop)
        # `wine --version` alone does NOT trigger the same wineboot/prefix
        # initialization as running an actual PE binary - the "created the
        # configuration directory" / wow64 noise still leaked into the first
        # real test's captured output when this step only ran --version.
        # Running the just-built exe once for real flushes that noise here.
        run: WINEDEBUG=-all wine larzscript-windows-x86_64.exe --version || true
      - name: Test under wine
        run: |
          cd native
          BINARY=../larzscript-windows-x86_64.exe RUN_PREFIX=wine LZ_CRLF_NORMALIZE=1 WINEDEBUG=-all ./run_tests.sh
      - name: Strip
        run: x86_64-w64-mingw32-strip larzscript-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: larzscript-windows-x86_64.exe
          path: larzscript-windows-x86_64.exe

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          # bump this key if the `./emsdk install` version below changes
          key: emsdk-latest-v1
      - name: Install Emscripten
        run: |
          if [ ! -d emsdk ]; then git clone --depth 1 https://github.com/emscripten-core/emsdk.git; fi
          cd emsdk && ./emsdk install latest && ./emsdk activate latest
      - name: Build wasm-node (CLI regression build) + wasm-web (browser bundle)
        run: |
          source emsdk/emsdk_env.sh
          cd native && make wasm-node wasm-web
      - name: Test under Node - the same suite every other platform runs
        run: |
          cd native
          BINARY="$PWD/wasm/larzscript-node.js" RUN_PREFIX=node SKIP_GLOB="socket_*" ./run_tests.sh
      - name: dom/ui bridge tests (Node+jsdom, no real browser needed)
        run: |
          cd native/tests-web
          npm install
          node ui_bridge.test.js
          node ui_fetch.test.js
      - name: Package the browser bundle
        run: |
          mkdir -p dist-web
          cp native/wasm/larzscript-web.js native/wasm/larzscript-web.wasm native/web/larzscript-web-bootstrap.js dist-web/
          cd dist-web && zip -r ../larzscript-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: larzscript-web
          path: larzscript-web.zip

  release:
    needs: [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64, windows-x86_64, web]
    if: startsWith(github.ref, 'refs/tags/native-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Asset names must exactly match what install.sh/install.ps1/larzscript
      # update request from releases/latest/download/<asset> - do not rename.
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "larzscript native ${{ github.ref_name }}" \
            --generate-notes
