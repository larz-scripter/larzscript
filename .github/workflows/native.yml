          cat > /tmp/verify_forward.lz << 'LZEOF'
          let session = ssh_open("127.0.0.1", 2222)
          ssh_auth_key(session, env("USER", "runner"), "/tmp/verify_key")
          ssh_listen_forward(session, 19900)
          print("listening")
          while true {
            let channel = ssh_accept_forward(session, 1000)
            if channel == nil { continue }
            let local_fd = socket_connect("127.0.0.1", 19801)
            while true {
