          print("stdout: " + result["stdout"])
          print("exit_status: " + str(result["exit_status"]))
          if not result["stdout"].contains("hello-from-real-sshd") { print("FAIL: unexpected output"); exit(1) }
          if result["exit_status"] != 0 { print("FAIL: nonzero exit status"); exit(1) }
          ssh_close(session)
          print("PASS")
          LZEOF
          /tmp/_larzscript_test /tmp/verify_ssh.lz
