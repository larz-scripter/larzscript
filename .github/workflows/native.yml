            cc -O2 -std=c11 -Wall -DLARZ_HAVE_LIBSSH -I"$LIBSSH_PREFIX/include" -I"$OPENSSL_PREFIX/include" \
              -o /tmp/_larzscript_test native/larzscript.c native/gssapi_stub.c \
