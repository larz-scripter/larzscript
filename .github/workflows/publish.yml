name: Publish to PyPI

# Publishes on a version tag (e.g. v0.1.0) using PyPI Trusted Publishing (OIDC) —
# no API tokens stored. One-time setup: add a pending publisher on pypi.org for
# project `larzscript`, owner `larz-scripter`, repo `larzscript`, workflow
# `publish.yml`, environment `pypi`; then create a GitHub environment named `pypi`.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
